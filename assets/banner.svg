<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="neon-ghost — a vibrant neon-on-dark colorscheme for neovim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="100%" stop-color="#140a26"/>
    </linearGradient>

    <radialGradient id="ghostFill" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0%"   stop-color="#b07bff" stop-opacity="0.45"/>
      <stop offset="55%"  stop-color="#6b3fd4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.05"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff3fb8"/>
      <stop offset="45%"  stop-color="#b07bff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"  result="b1"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>

    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b07bff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#scan)"/>

  <!-- horizon glow -->
  <ellipse cx="600" cy="360" rx="900" ry="120" fill="#ff3fb8" opacity="0.10"/>
  <ellipse cx="220" cy="360" rx="260"  ry="90"  fill="#00e5ff" opacity="0.12"/>

  <!-- starfield -->
  <g fill="#e8e6ff">
    <circle cx="80"   cy="60"  r="1.2" opacity="0.7"/>
    <circle cx="340"  cy="40"  r="1"   opacity="0.5"/>
    <circle cx="540"  cy="70"  r="1.5" opacity="0.8"/>
    <circle cx="760"  cy="30"  r="1"   opacity="0.5"/>
    <circle cx="980"  cy="55"  r="1.3" opacity="0.7"/>
    <circle cx="1120" cy="90"  r="1"   opacity="0.5"/>
    <circle cx="420"  cy="110" r="1"   opacity="0.4"/>
    <circle cx="900"  cy="130" r="1.2" opacity="0.6"/>
  </g>

  <!-- ghost -->
  <g transform="translate(130, 55)">
    <!-- outer halo -->
    <path d="M 0 140 A 100 100 0 0 1 200 140 L 200 250 Q 180 282 160 250 Q 140 282 120 250 Q 100 282 80 250 Q 60 282 40 250 Q 20 282 0 250 Z"
          fill="#00e5ff" opacity="0.10" filter="url(#glow)"/>

    <!-- body -->
    <path d="M 0 140 A 100 100 0 0 1 200 140 L 200 250 Q 180 282 160 250 Q 140 282 120 250 Q 100 282 80 250 Q 60 282 40 250 Q 20 282 0 250 Z"
          fill="url(#ghostFill)" stroke="#00e5ff" stroke-width="3" stroke-linejoin="round" filter="url(#softglow)"/>

    <!-- inner highlight -->
    <path d="M 40 90 Q 60 55 100 55" fill="none" stroke="#e8e6ff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

    <!-- eyes -->
    <g filter="url(#softglow)">
      <circle cx="70"  cy="140" r="14" fill="#ff3fb8"/>
      <circle cx="140" cy="140" r="14" fill="#ff3fb8"/>
    </g>
    <circle cx="74"  cy="135" r="4" fill="#ffffff"/>
    <circle cx="144" cy="135" r="4" fill="#ffffff"/>

    <!-- little o mouth -->
    <ellipse cx="105" cy="190" rx="9" ry="12" fill="#b07bff" opacity="0.95" filter="url(#softglow)"/>
  </g>

  <!-- title -->
  <g filter="url(#glow)">
    <text x="420" y="195"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
          font-size="104" font-weight="800" letter-spacing="-3"
          fill="url(#titleGrad)">neon-ghost</text>
  </g>

  <!-- tagline -->
  <text x="424" y="236"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="20" fill="#e8e6ff" opacity="0.72">
    a vibrant neon-on-dark colorscheme for neovim
  </text>

  <!-- palette dots -->
  <g transform="translate(424, 278)" filter="url(#softglow)">
    <circle cx="10"  cy="10" r="7" fill="#ff3fb8"/>
    <circle cx="34"  cy="10" r="7" fill="#00e5ff"/>
    <circle cx="58"  cy="10" r="7" fill="#b07bff"/>
    <circle cx="82"  cy="10" r="7" fill="#7dff6a"/>
    <circle cx="106" cy="10" r="7" fill="#ff9e4a"/>
    <circle cx="130" cy="10" r="7" fill="#ffcc00"/>
    <circle cx="154" cy="10" r="7" fill="#4fc3ff"/>
    <circle cx="178" cy="10" r="7" fill="#ff486f"/>
    <circle cx="202" cy="10" r="7" fill="#2ee6c0"/>
  </g>
</svg>
